name: Minsk news bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тест без публикации в Telegram (1 = да)"
        required: false
        default: "0"

permissions:
  contents: write   # нужно, чтобы сохранять published.json

concurrency:
  group: minsk-news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 feedparser python-dateutil Pillow

      - name: Run bot
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: "@Minsknewssss"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_POSTS_PER_RUN: "1"
          IMAGE_SOURCES: "commons,openverse"
          OPENVERSE_SOURCE: ""
          SOURCE_LINK: "0"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}

      - name: Save published list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --cached --quiet || (git commit -m "update published list" && git push)
